version: '3.9'
name: clinical-dojo

services:
  app:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-4319}:4319"
    environment:
      NODE_ENV: production
      PORT: 4319
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      # DB_PASSWORD has no default: an unpublished database with postgres/postgres
      # is worse than a container that refuses to start.
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?set DB_PASSWORD}@postgres:5432/${DB_NAME:-clinical}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:4319/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-clinical}
    # No host port mapping: the app reaches it over the compose network. Publish
    # a port only if you have a firewall rule that matches.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
